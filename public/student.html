<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student — Mark Attendance</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 420px; margin: 30px auto; padding: 0 15px; background:#f4f6f8; }
  h1 { font-size: 22px; }
  input, button { width: 100%; padding: 12px; margin: 6px 0; font-size: 16px; box-sizing: border-box; border-radius:6px; border:1px solid #ccc; }
  button { background: #16a34a; color: white; border: none; cursor: pointer; font-weight:bold; }
  button:hover { background:#128a3e; }
  button:disabled { background:#999; }
  .msg { margin-top:15px; padding:12px; border-radius:6px; font-size:14px; }
  .success { background:#dcfce7; color:#166534; }
  .error { background:#fee2e2; color:#991b1b; }
  .card { background:white; padding:18px; border-radius:8px; }
  .status { font-size:13px; color:#555; margin-top:5px; }
</style>
</head>
<body>
  <h1>🎓 Mark Your Attendance</h1>
  <div class="card">
    <input id="rollNo" placeholder="Roll Number" />
    <input id="className" placeholder="Class (e.g. CS101)" />
    <input id="period" placeholder="Period (e.g. 1)" />
    <input id="code" placeholder="Code given by teacher" maxlength="5" />
    <button id="submitBtn" onclick="submitAttendance()">Mark Attendance</button>
  </div>
  <div id="message"></div>

<script>
async function submitAttendance() {
  const roll_no = document.getElementById('rollNo').value.trim();
  const class_name = document.getElementById('className').value.trim();
  const period = document.getElementById('period').value.trim();
  const code = document.getElementById('code').value.trim();
  const msgDiv = document.getElementById('message');
  const btn = document.getElementById('submitBtn');

  if (!roll_no || !class_name || !period || !code) {
    msgDiv.innerHTML = '<div class="msg error">Please fill all fields.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Submitting...';

  try {
    const res = await fetch('/api/student/mark-attendance', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ roll_no, class_name, period, code })
    });
    const data = await res.json();

    if (data.success) {
      msgDiv.innerHTML = `<div class="msg success">✅ ${data.message}</div>`;
    } else {
      msgDiv.innerHTML = `<div class="msg error">❌ ${data.error}</div>`;
    }
  } catch (err) {
    msgDiv.innerHTML = '<div class="msg error">❌ Network error. Check your connection and try again.</div>';
  }

  btn.disabled = false;
  btn.textContent = 'Mark Attendance';
}
</script>
</body>
</html>
