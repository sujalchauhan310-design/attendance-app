<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Student — Mark Attendance</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d111c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          base: '#0d111c',
          surface: '#161b29',
          surface2: '#1e2436',
          line: '#2b3348',
          ink: '#ece9de',
          muted: '#8b93a7',
          gold: '#cda43f',
          golddim: '#8a6d1a',
          ok: '#34d399',
          err: '#f87171',
        },
        fontFamily: {
          serif: ['Lora', 'Georgia', 'serif'],
          sans: ['Inter', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  body { background: #0d111c; }
  input, select { color-scheme: dark; }
  ::selection { background: #cda43f; color: #0d111c; }
</style>
</head>
<body class="bg-base text-ink font-sans min-h-screen">
<div class="max-w-md mx-auto px-4 py-8 pb-16">

  <!-- Masthead -->
  <div class="mb-6">
    <div class="text-xs tracking-wide text-gold/80 font-medium mb-1">Student Portal</div>
    <h1 class="font-serif text-2xl font-semibold text-ink">Mark Attendance</h1>
    <p class="text-sm text-muted mt-1">Fill in your details below to record today's attendance.</p>
  </div>

  <!-- Form card -->
  <div class="bg-surface border border-line rounded-xl p-5 space-y-4 shadow-lg shadow-black/20">

    <!-- Step 1: Code (Always visible) -->
    <div class="bg-gold/10 border-2 border-gold rounded-lg p-3.5">
      <label class="block text-base font-semibold text-gold mb-1.5">Step 1: Code from teacher</label>
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off"
        placeholder="5-digit code"
        class="w-full bg-surface2 border-2 border-gold/60 rounded-lg px-4 py-3.5 text-2xl font-bold text-center text-gold placeholder-muted/60 tracking-[0.3em] focus:outline-none focus:ring-2 focus:ring-gold focus:border-gold transition" />
      <p id="codeErr" class="hidden text-xs text-err mt-1">Code can only contain digits (0–9).</p>
    </div>

    <!-- Step 2: System Selection (Shows after code) -->
    <div id="systemSection" style="display:none;">
      <label class="block text-sm font-medium text-ink mb-1.5">Step 2: System <span class="text-xs font-normal text-muted">(must match your teacher's code)</span></label>
      <div class="grid grid-cols-2 gap-2" id="systemGroup">
        <label class="cursor-pointer">
          <input type="radio" name="system" value="Annual" class="peer sr-only">
          <span class="block text-center rounded-lg border border-line bg-surface2 px-3.5 py-2.5 text-sm font-medium text-muted transition peer-checked:border-gold peer-checked:bg-gold/10 peer-checked:text-gold peer-focus-visible:ring-2 peer-focus-visible:ring-gold/60">Annual</span>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="system" value="Semester" class="peer sr-only">
          <span class="block text-center rounded-lg border border-line bg-surface2 px-3.5 py-2.5 text-sm font-medium text-muted transition peer-checked:border-gold peer-checked:bg-gold/10 peer-checked:text-gold peer-focus-visible:ring-2 peer-focus-visible:ring-gold/60">Semester</span>
        </label>
      </div>
    </div>

    <!-- Step 3: Rest of the form (Shows after system selection) -->
    <div id="mainFormSection" style="display:none;">
      <div class="text-xs text-gold/60 mb-3 font-medium">Step 3: Your Details</div>

      <div>
        <label class="block text-sm font-medium text-ink mb-1.5">Roll Number</label>
        <input id="rollNo" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
          placeholder="e.g. 45678"
          class="w-full bg-surface2 border border-line rounded-lg px-3.5 py-2.5 text-ink placeholder-muted/60 focus:outline-none focus:ring-2 focus:ring-gold/60 focus:border-gold/60 transition" />
        <p id="rollNoErr" class="hidden text-xs text-err mt-1">Roll number can only contain digits (0–9).</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-ink mb-1.5">Your Name</label>
        <input id="studentName" type="text" placeholder="e.g. Priya Sharma"
          class="w-full bg-surface2 border border-line rounded-lg px-3.5 py-2.5 text-ink placeholder-muted/60 focus:outline-none focus:ring-2 focus:ring-gold/60 focus:border-gold/60 transition" />
      </div>

      <div>
        <label class="block text-sm font-medium text-ink mb-1.5">Class</label>
        <select id="className" class="w-full bg-surface2 border border-line rounded-lg px-3.5 py-2.5 text-ink focus:outline-none focus:ring-2 focus:ring-gold/60 focus:border-gold/60 transition">
          <option value="">Select your class</option>
          <option>BA 1st</option><option>BA 2nd</option><option>BA 3rd</option>
          <option>BSc 1st</option><option>BSc 2nd</option><option>BSc 3rd</option>
          <option>BCom 1st</option><option>BCom 2nd</option><option>BCom 3rd</option>
          <option>MA 1st</option><option>MA 2nd</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-ink mb-1.5">Subject <span class="text-xs font-normal text-muted">(must match your teacher's code)</span></label>
        <select id="subject" class="w-full bg-surface2 border border-line rounded-lg px-3.5 py-2.5 text-ink focus:outline-none focus:ring-2 focus:ring-gold/60 focus:border-gold/60 transition">
          <option value="">Select subject</option>
          <option>Political Science</option><option>History</option><option>Public Administration</option>
          <option>Sociology</option><option>Economics</option><option>Hindi</option><option>English</option>
          <option>Geography</option><option>Psychology</option><option>Philosophy</option><option>Mathematics</option>
          <option>Physics</option><option>Chemistry</option><option>Biology</option><option>Commerce</option>
          <option>Computer Science</option><option>Physical Education</option><option>Other</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-ink mb-1.5">Course Type <span class="text-xs font-normal text-muted">(must match your teacher's code)</span></label>
        <select id="courseType" class="w-full bg-surface2 border border-line rounded-lg px-3.5 py-2.5 text-ink focus:outline-none focus:ring-2 focus:ring-gold/60 focus:border-gold/60 transition">
          <option value="">Select course type</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-ink mb-1.5">Major Subject <span class="text-xs font-normal text-muted">(optional)</span></label>
        <select id="majorSubject" class="w-full bg-surface2 border border-line rounded-lg px-3.5 py-2.5 text-ink focus:outline-none focus:ring-2 focus:ring-gold/60 focus:border-gold/60 transition">
          <option value="">Select major subject</option>
          <option>Political Science</option><option>History</option><option>Public Administration</option>
          <option>Sociology</option><option>Economics</option><option>Hindi</option><option>English</option>
          <option>Geography</option><option>Psychology</option><option>Philosophy</option><option>Mathematics</option>
          <option>Physics</option><option>Chemistry</option><option>Biology</option><option>Commerce</option>
          <option>Computer Science</option><option>Physical Education</option><option>Other</option>
        </select>
      </div>

      <!-- Location status -->
      <div id="locBox" class="rounded-lg border border-line bg-surface2/60 px-3.5 py-3">
        <div class="text-sm text-muted" id="locStatus">📍 Location: not fetched yet</div>
        <button type="button" id="retryLocBtn" onclick="captureLocation()" style="display:none;"
          class="mt-2 text-sm font-medium text-gold hover:text-gold/80 transition">🔄 Retry Location</button>
      </div>

      <button id="submitBtn" onclick="submitAttendance()" class="w-full bg-gold hover:bg-gold/90 text-base font-semibold text-[#171208] rounded-lg py-3 transition disabled:opacity-50 disabled:cursor-not-allowed">Mark Attendance</button>
    </div>
  </div>

  <!-- Success/Error message -->
  <div id="message" class="hidden mt-4"></div>
</div>

<script>
let capturedCoords = null;
let locationAttempts = 0;
const MAX_LOCATION_RETRIES = 3;

// Progressive form reveal: Code → System → Main form
document.getElementById('code').addEventListener('input', function() {
  const code = this.value.trim();
  const systemSection = document.getElementById('systemSection');
  
  // Validate code is digits only
  if (code && !/^[0-9]*$/.test(code)) {
    document.getElementById('codeErr').classList.remove('hidden');
    systemSection.style.display = 'none';
    return;
  } else {
    document.getElementById('codeErr').classList.add('hidden');
  }
  
  // Show system selection after 5 digits entered
  if (code.length === 5) {
    systemSection.style.display = 'block';
  } else {
    systemSection.style.display = 'none';
    document.getElementById('mainFormSection').style.display = 'none';
  }
});

// System selection reveals main form and updates course type options
document.querySelectorAll('input[name="system"]').forEach(radio => {
  radio.addEventListener('change', function() {
    const system = this.value;
    const mainFormSection = document.getElementById('mainFormSection');
    const courseTypeSelect = document.getElementById('courseType');
    
    // Show main form
    mainFormSection.style.display = 'block';
    
    // Update course type options based on system
    courseTypeSelect.innerHTML = '<option value="">Select course type</option>';
    
    if (system === 'Annual') {
      courseTypeSelect.innerHTML += `
        <option value="Core">Core</option>
        <option value="Elective">Elective</option>
        <option value="Foundation">Foundation</option>
      `;
    } else if (system === 'Semester') {
      courseTypeSelect.innerHTML += `
        <option value="DSC">DSC — Discipline Specific Core</option>
        <option value="SEC">SEC — Skill Enhancement Course</option>
        <option value="GE">GE — Generic Elective</option>
        <option value="AEC">AEC — Ability Enhancement Course</option>
        <option value="VAC">VAC — Value Added Course</option>
        <option value="MDC">MDC — Multi-Disciplinary Course</option>
      `;
    }
    
    // Start capturing location when form is revealed
    captureLocation();
  });
});

// Roll number validation
document.getElementById('rollNo').addEventListener('input', function() {
  const rollNo = this.value.trim();
  const errEl = document.getElementById('rollNoErr');
  
  if (rollNo && !/^[0-9]*$/.test(rollNo)) {
    errEl.classList.remove('hidden');
  } else {
    errEl.classList.add('hidden');
  }
});

// Capture location
function captureLocation() {
  const statusEl = document.getElementById('locStatus');
  const retryBtn = document.getElementById('retryLocBtn');
  
  if (!navigator.geolocation) {
    statusEl.innerHTML = '⚠️ Location: not supported by your browser';
    retryBtn.style.display = 'none';
    return;
  }
  
  statusEl.innerHTML = '📍 Location: fetching...';
  retryBtn.style.display = 'none';
  locationAttempts++;
  
  navigator.geolocation.getCurrentPosition(
    (position) => {
      const coords = position.coords;
      
      // Speed validation - reject if moving too fast (>50 m/s = 180 km/h)
      if (coords.speed && coords.speed > 50) {
        statusEl.innerHTML = '<div class="text-err">⚠️ Location error: Speed too high. Please try again when stationary.</div>';
        retryBtn.style.display = 'block';
        capturedCoords = null;
        return;
      }
      
      capturedCoords = coords;
      statusEl.innerHTML = `✅ Location: captured (accuracy: ${Math.round(coords.accuracy)}m)`;
      retryBtn.style.display = 'none';
    },
    (error) => {
      let msg = '⚠️ Location: ';
      if (error.code === 1) {
        msg += 'permission denied';
      } else if (error.code === 2) {
        msg += 'unavailable';
      } else if (error.code === 3) {
        msg += 'timeout';
      } else {
        msg += 'error';
      }
      
      statusEl.innerHTML = msg;
      
      if (locationAttempts < MAX_LOCATION_RETRIES) {
        retryBtn.style.display = 'block';
      } else {
        statusEl.innerHTML += ' (max retries reached)';
        retryBtn.style.display = 'none';
      }
      
      capturedCoords = null;
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

// Submit attendance
async function submitAttendance() {
  const messageEl = document.getElementById('message');
  const submitBtn = document.getElementById('submitBtn');
  
  // Get form values
  const code = document.getElementById('code').value.trim();
  const system = document.querySelector('input[name="system"]:checked')?.value;
  const rollNo = document.getElementById('rollNo').value.trim();
  const studentName = document.getElementById('studentName').value.trim();
  const className = document.getElementById('className').value.trim();
  const subject = document.getElementById('subject').value.trim();
  const courseType = document.getElementById('courseType').value.trim();
  const majorSubject = document.getElementById('majorSubject').value.trim();
  
  // Validation
  if (!code || code.length !== 5) {
    showMessage('Please enter the 5-digit code from your teacher.', 'error');
    return;
  }
  
  if (!/^[0-9]+$/.test(code)) {
    showMessage('Code can only contain digits (0–9).', 'error');
    return;
  }
  
  if (!system) {
    showMessage('Please select Annual or Semester system.', 'error');
    return;
  }
  
  if (!rollNo) {
    showMessage('Please enter your roll number.', 'error');
    return;
  }
  
  if (!/^[0-9]+$/.test(rollNo)) {
    showMessage('Roll number can only contain digits (0–9).', 'error');
    return;
  }
  
  if (!studentName) {
    showMessage('Please enter your name.', 'error');
    return;
  }
  
  if (!className) {
    showMessage('Please select your class.', 'error');
    return;
  }
  
  if (!subject) {
    showMessage('Please select the subject.', 'error');
    return;
  }
  
  if (!courseType) {
    showMessage('Please select the course type.', 'error');
    return;
  }
  
  // Disable submit button
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';
  
  try {
    const payload = {
      code,
      roll_no: rollNo,
      student_name: studentName,
      class_name: className,
      subject,
      course_type: courseType,
      major_subject: majorSubject || null,
      system,
      lat: capturedCoords ? capturedCoords.latitude : null,
      lng: capturedCoords ? capturedCoords.longitude : null,
      accuracy: capturedCoords ? capturedCoords.accuracy : null
    };
    
    const response = await fetch('/api/student/mark-attendance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    
    const data = await response.json();
    
    if (response.ok && data.success) {
      showMessage('✅ Attendance marked successfully!', 'success');
      
      // Reset form after 2 seconds
      setTimeout(() => {
        document.getElementById('code').value = '';
        document.getElementById('rollNo').value = '';
        document.getElementById('studentName').value = '';
        document.getElementById('className').value = '';
        document.getElementById('subject').value = '';
        document.getElementById('courseType').value = '';
        document.getElementById('majorSubject').value = '';
        document.querySelector('input[name="system"]:checked').checked = false;
        document.getElementById('systemSection').style.display = 'none';
        document.getElementById('mainFormSection').style.display = 'none';
        messageEl.classList.add('hidden');
        capturedCoords = null;
        locationAttempts = 0;
        document.getElementById('locStatus').innerHTML = '📍 Location: not fetched yet';
      }, 2000);
    } else {
      showMessage(data.error || 'Failed to mark attendance. Please try again.', 'error');
    }
  } catch (error) {
    showMessage('Network error. Please check your connection and try again.', 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Mark Attendance';
  }
}

function showMessage(text, type) {
  const messageEl = document.getElementById('message');
  messageEl.classList.remove('hidden');
  
  if (type === 'success') {
    messageEl.innerHTML = `<div class="rounded-lg border border-ok/40 bg-ok/10 text-ok text-sm px-4 py-3">${text}</div>`;
  } else {
    messageEl.innerHTML = `<div class="rounded-lg border border-err/40 bg-err/10 text-err text-sm px-4 py-3">${text}</div>`;
  }
  
  // Scroll to message
  messageEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>
</body>
</html>
