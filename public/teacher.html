<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher — Attendance Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap wide">
  <div class="masthead">
    <div class="kicker">Teacher Portal</div>
    <h1>Attendance Register</h1>
    <p>Generate a code for your class, then review who has marked attendance.</p>
  </div>

  <div class="card">
    <label>Course / Year</label>
    <select id="className">
      <option value="">Select class</option>
      <option>BA 1st</option>
      <option>BA 2nd</option>
      <option>BA 3rd</option>
      <option>BSc 1st</option>
      <option>BSc 2nd</option>
      <option>BSc 3rd</option>
      <option>BCom 1st</option>
      <option>BCom 2nd</option>
      <option>BCom 3rd</option>
      <option>MA 1st</option>
      <option>MA 2nd</option>
    </select>

    <label>Subject</label>
    <select id="subjectSelect">
      <option value="">Select subject</option>
      <option>Political Science</option>
      <option>History</option>
      <option>Public Administration</option>
      <option>Sociology</option>
      <option>Economics</option>
      <option>Hindi</option>
      <option>English</option>
      <option>Geography</option>
      <option>Psychology</option>
      <option>Philosophy</option>
      <option>Mathematics</option>
      <option>Physics</option>
      <option>Chemistry</option>
      <option>Biology</option>
      <option>Commerce</option>
      <option>Computer Science</option>
      <option>Other</option>
    </select>

    <button onclick="generateCode()">Generate New Code</button>
  </div>

  <div class="card">
    <label>Upload Student List <span class="hint">(one-time setup — saves everyone's name & subject so it auto-fills for any roll number)</span></label>
    <textarea id="rosterText" rows="6" placeholder="Paste one student per line, like:&#10;101,Priya Sharma,History&#10;102,Rahul Verma,Sociology&#10;103,Anjali Singh" style="width:100%; padding:11px 12px; font-family:'Inter',sans-serif; font-size:14.5px; border:1px solid var(--line); border-radius:4px; background:#fdfcf9; color:var(--ink);"></textarea>
    <button class="secondary" onclick="uploadRoster()">Upload List</button>
    <div id="uploadMsg"></div>
  </div>

  <div id="codeSection" style="display:none;" class="card">
    <div class="code-block">
      <div class="code-num" id="codeDisplay">-----</div>
      <div class="code-timer" id="timer"></div>
    </div>
  </div>

  <div class="card">
    <label>Attendance List — pick a session <span class="hint">(each code you generate is a separate session with its own list &amp; PDF)</span></label>
    <select id="sessionSelect">
      <option value="">All sessions today</option>
    </select>

    <div class="list-header">
      <h2 id="attendanceCount">Total marked: 0</h2>
      <span class="date" id="attendanceDate"></span>
    </div>
    <table id="attendanceTable">
      <thead><tr><th>S.No</th><th>Name</th><th>Roll No</th><th>Subject</th><th>Marked At</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="btn-row">
      <button class="secondary" onclick="loadAttendance()">Refresh List</button>
      <button class="ghost" onclick="printList()">Print / Save as PDF</button>
    </div>
  </div>
</div>

<script>
let expiryTimestamp = null;
let timerInterval = null;
let lastRecords = [];
let lastDate = '';
let lastSessionLabel = '';

async function generateCode() {
  const class_name = document.getElementById('className').value.trim();
  const subject = document.getElementById('subjectSelect').value.trim();
  if (!class_name || !subject) { alert('Select both class and subject first'); return; }

  const res = await fetch('/api/teacher/generate-code', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ class_name, subject })
  });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }

  document.getElementById('codeSection').style.display = 'block';
  document.getElementById('codeDisplay').textContent = data.code;
  expiryTimestamp = Date.now() + data.expires_in_seconds * 1000;

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();

  // Reload the session list and select the session we just created
  await loadSessions(data.session_id);
}

// Loads today's sessions into the dropdown. Pass a session_id to pre-select it.
async function loadSessions(selectId) {
  const class_name = document.getElementById('className').value.trim();
  const subject = document.getElementById('subjectSelect').value.trim();
  const params = new URLSearchParams();
  if (class_name) params.set('class_name', class_name);
  if (subject) params.set('subject', subject);

  try {
    const res = await fetch('/api/teacher/sessions?' + params.toString());
    const data = await res.json();
    const sel = document.getElementById('sessionSelect');
    const previous = selectId || sel.value;

    sel.innerHTML = '<option value="">All sessions today</option>';
    (data.sessions || []).forEach((s, i) => {
      const opt = document.createElement('option');
      opt.value = s.session_id;
      const time = new Date(s.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      opt.textContent = `${s.class_name} — ${s.subject} — ${time}`;
      sel.appendChild(opt);
    });
    if (previous) sel.value = previous;
  } catch (err) {}
}

function updateTimer() {
  const remaining = Math.max(0, Math.round((expiryTimestamp - Date.now())/1000));
  const min = Math.floor(remaining/60);
  const sec = remaining % 60;
  document.getElementById('timer').textContent = remaining > 0
    ? `Expires in ${min}:${sec.toString().padStart(2,'0')}`
    : 'Code expired — generate a new one';
  if (remaining <= 0) clearInterval(timerInterval);
}

function formatTime(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatDateHeading(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

async function uploadRoster() {
  const roster_text = document.getElementById('rosterText').value;
  const msgDiv = document.getElementById('uploadMsg');
  if (!roster_text.trim()) { alert('Paste the student list first.'); return; }

  try {
    const res = await fetch('/api/teacher/upload-roster', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ roster_text })
    });
    const data = await res.json();
    if (data.success) {
      msgDiv.innerHTML = `<div class="msg success">✅ Saved ${data.added} student(s). ${data.skipped ? data.skipped + ' line(s) skipped (missing roll no or name).' : ''}</div>`;
    } else {
      msgDiv.innerHTML = `<div class="msg error">✕ ${data.error}</div>`;
    }
  } catch (err) {
    msgDiv.innerHTML = '<div class="msg error">✕ Network error. Try again.</div>';
  }
}

async function loadAttendance() {
  const class_name = document.getElementById('className').value.trim();
  const subject = document.getElementById('subjectSelect').value.trim();
  const sessionSel = document.getElementById('sessionSelect');
  const session_id = sessionSel.value;
  lastSessionLabel = session_id
    ? sessionSel.options[sessionSel.selectedIndex].textContent
    : 'All sessions today';

  const params = new URLSearchParams();
  if (class_name) params.set('class_name', class_name);
  if (subject) params.set('subject', subject);
  if (session_id) params.set('session_id', session_id);

  const res = await fetch('/api/teacher/attendance?' + params.toString());
  const data = await res.json();

  lastRecords = data.records;
  lastDate = data.date;

  document.getElementById('attendanceCount').textContent = `Total marked: ${data.count}`;
  document.getElementById('attendanceDate').textContent = formatDateHeading(data.date);

  const tbody = document.querySelector('#attendanceTable tbody');
  tbody.innerHTML = '';
  data.records.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i + 1}</td><td>${r.student_name || '-'}</td><td>${r.roll_no}</td><td>${r.subject || '-'}</td><td>${formatTime(r.marked_at)}</td>`;
    tbody.appendChild(tr);
  });
}

function printList() {
  if (!lastRecords.length) { alert('Refresh the attendance list first.'); return; }
  const className = document.getElementById('className').value.trim() || '-';
  const subject = document.getElementById('subjectSelect').value.trim() || '-';
  const rows = lastRecords.map((r, i) =>
    `<tr><td>${i + 1}</td><td>${r.student_name || '-'}</td><td>${r.roll_no}</td><td>${r.subject || '-'}</td><td>${formatTime(r.marked_at)}</td></tr>`
  ).join('');
  const win = window.open('', '_blank');
  win.document.write(`
    <html><head><title>Attendance - ${className} - ${subject} - ${formatDateHeading(lastDate)}</title>
    <style>
      body { font-family: 'Georgia', serif; padding: 30px; color: #232733; }
      h1 { font-size: 20px; margin-bottom: 4px; }
      .meta { color:#555; margin-bottom: 20px; font-family: Arial, sans-serif; font-size: 13px; }
      table { width:100%; border-collapse: collapse; font-family: Arial, sans-serif; }
      th, td { border:1px solid #999; padding:8px; text-align:left; font-size:14px; }
      th { background:#1f2a44; color:#fff; }
      tbody tr:nth-child(even) { background:#f6f4ee; }
    </style>
    </head><body>
      <h1>Attendance Register — ${className} — ${subject}</h1>
      <div class="meta">${formatDateHeading(lastDate)} &nbsp;|&nbsp; Session: ${lastSessionLabel || 'All sessions today'} &nbsp;|&nbsp; Total present: ${lastRecords.length}</div>
      <table><thead><tr><th>S.No</th><th>Name</th><th>Roll No</th><th>Subject</th><th>Marked At</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </body></html>
  `);
  win.document.close();
  win.focus();
  win.print();
}
// Whenever the class or subject changes, refresh the list of sessions for it
document.getElementById('className').addEventListener('change', () => loadSessions());
document.getElementById('subjectSelect').addEventListener('change', () => loadSessions());
loadSessions();
</script>
</body>
</html>
